---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hello-world
  labels:
    app: mcp-hello-world
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"mcp-hello-world:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"mcp-hello-world\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-hello-world
  template:
    metadata:
      labels:
        app: mcp-hello-world
    spec:
      containers:
      - name: mcp-hello-world
        image: " "
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: NODE_ENV
          value: production
        - name: TZ
          value: UTC
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
